# Config for `cargo about generate`, which writes THIRD_PARTY_LICENSES.
# Order sets preference when a crate offers a choice of licenses.

targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
]
